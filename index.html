#pager{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pager::-webkit-scrollbar{display:none}
#vz{position:absolute;z-index:5;left:calc(var(--ox) + var(--u)*39);top:calc(var(--oy) + var(--u)*175);width:calc(var(--u)*22);height:calc(var(--u)*10)}
#vz.on::after,#vz.ok::after{content:"";position:absolute;left:86%;top:50%;width:calc(var(--u)*1.6);height:calc(var(--u)*1.4);border-radius:50%;background:#fff;opacity:.45;transform:translate(-50%,-50%)}
#vz.ok::after{background:#7CFC00;opacity:.95}
#gd{position:fixed;z-index:70;display:none;width:9px;height:9px;border-radius:50%;background:#7CFC00;box-shadow:0 0 6px #7CFC00;pointer-events:none;left:var(--gx,100px);top:max(8px,calc(env(safe-area-inset-top,0px)*.5 + var(--gy,0px) - 4px))}
#toast{position:absolute;z-index:6;top:18%;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:calc(var(--u)*3.2);padding:calc(var(--u)*1.5) calc(var(--u)*3);border-radius:calc(var(--u)*4);display:none;white-space:nowrap}
.page{flex:0 0 100%;scroll-snap-align:start;overflow:hidden}
.grid{display:grid;margin:calc(var(--oy) + var(--u)*17.5) 0 0 calc(var(--ox) + var(--u)*7.3);grid-template-columns:repeat(4,calc(var(--u)*16.2));column-gap:calc(var(--u)*6.87);row-gap:calc(var(--u)*4.1)}
.app{height:calc(var(--u)*20.8);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;font-family:inherit;touch-action:pan-x}
.app .i{overflow:hidden;width:calc(var(--u)*16.2);height:calc(var(--u)*16.2);border-radius:calc(var(--u)*3.7);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*6.2);font-weight:700;color:#fff}
.app .i svg{width:70%;height:70%}
.app span{margin-top:calc(var(--u)*1);font-size:calc(var(--u)*3.1);line-height:calc(var(--u)*3.6);color:#fff;text-shadow:0 0 2px #0006;max-width:calc(var(--u)*21);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px 40px}
#lock,#adm{z-index:50;background:#0b0b1e;color:#fff;user-select:text}
#ins{z-index:40;background:var(--bg);color:var(--tx);user-select:text;line-height:1.5}
#lock input,#adm input,#adm select,#adm textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#1a1a33;color:#fff;font-size:16px;margin:6px 0;font-family:inherit}
.bt{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#f5c542;color:#1b1b3a;font-size:17px;font-weight:600;margin:8px 0}
.cd{font-size:26px;letter-spacing:2px;text-align:center;padding:12px;border-radius:10px;background:#1a1a33;margin:8px 0;user-select:all}
.mg{color:#ff8a80;min-height:22px}
#ins h2{margin:22px 0 6px;font-size:19px}#ins p,#ins li{font-size:15px;margin:4px 0}
#nv{position:fixed;inset:0;z-index:10;background:var(--bg);color:var(--tx);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 40px;display:none;user-select:text}
h1{font-size:32px;margin:20px 0 14px}
.row{background:var(--card);padding:14px 16px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.row span{color:var(--mu);font-size:14px}

 if(view=="home"){h='<div class="bar"><button class="t" onclick="closeNotes()">‹ Inicio</button><span><button class="t" onclick="showIns()">ⓘ</button> <button class="t" onclick="addList()">+ Nueva</button></span></div><div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px"><div style="width:56px;height:56px;border-radius:15px;background:#1b1b3a;display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M5 20Q20 7 35 20Q20 33 5 20Z" fill="none" stroke="#f5c542" stroke-width="2.5"/><circle cx="20" cy="20" r="6" fill="#f5c542"/><circle cx="20" cy="20" r="2.5" fill="#1b1b3a"/></svg></div><div><h1 id="ttl" style="margin:0">Block Mental</h1><div style="color:var(--mu);font-size:14px">por el Mentalista Camilo</div></div></div>';

 else if(view=="list"){var l=data.lists[cur],it=l.items.split("\n"),n=num();

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}

function isP(n){return n.indexOf("pensast")==0}
function isOk(n){return n=="ok"||n=="okay"||n=="okey"||n=="okei"||n=="oquei"}
function numOf(tk){var d=[],w=[],n=0;tk.forEach(function(t){if(/^\d+$/.test(t.n))d.push(t.n);else w.push(t.n)});
 var wn=words2num(w.join(" "));
 if(d.length&&!wn)n=parseInt(d.length==1?d[0]:d.join(""),10);else if(d.length)n=wn+parseInt(d[0],10);else n=wn;
 return(n>=1&&n<=100)?n:0}
var VW={n:"ok",a:"pensaste",e:"ok",gx:100,gy:0},dotS=false;
function seq(s){return norm(s||"").split(" ").filter(Boolean)}
function cap(s){return seq(s).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(" ")}

function vwSave(){try{localStorage.setItem("bm_vw",JSON.stringify(VW))}catch(e){}}
function dotOn(){dotS=true;document.getElementById("gd").style.display="block"}
function dotOff(){dotS=false;document.getElementById("gd").style.display="none"}
function teq(t,w){return w=="ok"?isOk(t):(w=="pensaste"?isP(t):t==w)}
function mt(i,q){if(i+q.length>vbuf.length)return false;for(var k=0;k<q.length;k++){if(!teq(vbuf[i+k].n,q[k]))return false}return true}
function voiceParse(raw){
 vbuf=vbuf.concat(vtoks(raw));var got=false,i=0,N=seq(VW.n),A=seq(VW.a),E=seq(VW.e);
 if(!N.length)N=["ok"];if(!A.length)A=["pensaste"];if(!E.length)E=["ok"];
 while(i<vbuf.length){
  if(mt(i,N)){var s=i+N.length,j=-1,jl=0;
   for(var k=s;k<vbuf.length&&k<=s+6;k++){if(mt(k,E)){j=k;jl=E.length;break}if(mt(k,A)){j=k;jl=0;break}}
   if(j<0){if(vbuf.length-s>6){i++;continue}break}
   var n=numOf(vbuf.slice(s,j));
   if(n){secret=String(n);got=true;i=j+jl}else i=j;
   continue}
  if(mt(i,A)){var s2=i+A.length,j2=-1;
   if(VW.a=="pensaste"&&vbuf[s2]&&(vbuf[s2].n=="en"||vbuf[s2].n=="a"))s2++;
   for(var k2=s2;k2<vbuf.length&&k2<=s2+7;k2++){if(mt(k2,E)){j2=k2;break}}
   if(j2<0){if(vbuf.length-s2>7){i++;continue}break}
   if(j2>s2){vf=vbuf.slice(s2,j2).map(function(x){return x.r.charAt(0).toUpperCase()+x.r.slice(1)}).join(" ");got=true}
   i=j2+E.length;continue}
  i++}
 vbuf=vbuf.slice(i);if(vbuf.length>30)vbuf=vbuf.slice(-30);
 return got}

function mark(){document.getElementById("vz").className=want?"on":""}
var alive=false,quiet=false,done={};
function listen(){if(!want)return;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){want=false;mark();toast("Sin voz en este navegador. Abre en Safari");return}
 try{if(rec){rec.onend=null;rec.onerror=null;rec.onresult=null;rec.abort()}}catch(x){}
 rec=new SR();rec.lang="es-PE";rec.continuous=true;rec.interimResults=false;done={};alive=false;
 rec.onstart=function(){alive=true;if(!quiet)toast("Escuchando");quiet=true};
 rec.onresult=function(e){for(var i=0;i<e.results.length;i++){var r=e.results[i],k=i+"|"+r[0].transcript;if(!r.isFinal||done[k])continue;done[k]=1;
  if(voiceParse(r[0].transcript)){var z=document.getElementById("vz");z.className="ok";setTimeout(mark,700);dotOn();if(view=="list")render()}}};
 rec.onerror=function(e){if(e.error=="not-allowed"||e.error=="service-not-allowed"){want=false;mark();toast(e.error=="service-not-allowed"?"Activa Dictado en Ajustes":"Micrófono bloqueado en este sitio")}};
 rec.onend=function(){alive=false;if(want)setTimeout(listen,400);else mark()};
 try{rec.start()}catch(x){setTimeout(listen,800)}}
setInterval(function(){if(want&&!alive)listen()},6000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&want)listen()});

function b2u(a){var s="";a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function u2b(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

function today(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
async function vk(id,key){var p=(key||"").trim().split(".");if(p.length!=2||!/^\d{8}$/.test(p[0]))return false;
 try{var k=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  var ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,u2b(p[1]),new TextEncoder().encode("BM1:"+id+":"+p[0]));
  if(!ok)return false;if(p[0]!="00000000"&&today()>parseInt(p[0],10))return "exp";return true}catch(e){return false}}

async function admin(){var pw=prompt("Contraseña de administrador");if(!pw)return;pw=pw.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
 try{var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u2b(ENC.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u2b(ENC.i)},k,u2b(ENC.c));
  var sk=await crypto.subtle.importKey("jwk",JSON.parse(new TextDecoder().decode(pt)),{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
  adminUI(sk)}catch(e){alert("Contraseña incorrecta")}}
async function mkKey(sk,id,days){var e="00000000";if(days){var d=new Date();d.setDate(d.getDate()+days);e=String(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())}
